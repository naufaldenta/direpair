name: direpair-local

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: direpair_content
      MARIADB_USER: direpair
      MARIADB_PASSWORD: direpair-local-only
      MARIADB_ROOT_PASSWORD: direpair-root-local-only
    volumes:
      - wordpress_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: direpair_content
      WORDPRESS_DB_USER: direpair
      WORDPRESS_DB_PASSWORD: direpair-local-only
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ../../apps/wordpress-plugin/direpair-content:/var/www/html/wp-content/plugins/direpair-content:ro
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: direpair_content
      WORDPRESS_DB_USER: direpair
      WORDPRESS_DB_PASSWORD: direpair-local-only
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress_data:/var/www/html
      - ../../apps/wordpress-plugin/direpair-content:/var/www/html/wp-content/plugins/direpair-content:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  wordpress_database:
  wordpress_data:
